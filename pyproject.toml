[project]
name = "smorphila"
version = "0.1.0"
description = "Software for MORPHometric Image Landmark Acquisition"
authors = [{ name="Sergio Castellano", email="sergio.castellano@unito.it" }, { name="Olivier Friard", email="olivier.friard@unito.it" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86,<5",
    "pyside6>=6.9.0",
]

license = "GPL-3.0-only"

classifiers=[
        "Operating System :: OS Independent",
        "Intended Audience :: Science/Research",
        "Intended Audience :: Education",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Scientific/Engineering",
        "Topic :: Scientific/Engineering :: Visualization",
        "Operating System :: OS Independent"
    ]

[project.urls]
Homepage = "https://github.com/castellanosergio/smorphila"
Documentation = "https://github.com/castellanosergio/smorphila/blob/main/SMORPHILA_user_guide.md"
Source_code = "https://github.com/castellanosergio/smorphila"
Issues = "https://github.com/castellanosergio/smorphila/issues"


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[project.gui-scripts]
smorphila = "smorphila.main:run"
